Gruvbox Dark:
  #
  # Gruvbox palette
  #

  # Background
  gruvbox-bg-0h: "hsl(200, 5%, 12%)"
  gruvbox-bg-0s: "hsl(20, 3%, 16%)"
  gruvbox-bg-0: "hsl(0, 0%, 16%)"
  gruvbox-bg-1: "hsl(17, 6%, 23%)"
  gruvbox-bg-2: "hsl(16, 7%, 29%)"
  gruvbox-bg-3: "hsl(23, 10%, 36%)"
  gruvbox-bg-4: "hsl(29, 10%, 44%)"
  gruvbox-bg-5: "hsl(30, 12%, 51%)"

  # Foreground
  gruvbox-fg-4: "hsl(33, 17%, 59%)"
  gruvbox-fg-3: "hsl(38, 25%, 66%)"
  gruvbox-fg-2: "hsl(40, 38%, 73%)"
  gruvbox-fg-1: "hsl(42, 60%, 81%)"
  gruvbox-fg-0: "hsl(48, 90%, 88%)"

  # Colours
  gruvbox-red: "hsl(2, 74%, 46%)"
  gruvbox-green: "hsl(59, 72%, 35%)"
  gruvbox-yellow: "hsl(40, 74%, 48%)"
  gruvbox-blue: "hsl(182, 32%, 40%)"
  gruvbox-purple: "hsl(333, 34%, 54%)"
  gruvbox-aqua: "hsl(122, 21%, 51%)"
  gruvbox-orange: "hsl(24, 89%, 45%)"

  # Bright
  gruvbox-green-bright: "hsl(104, 35%, 62%)"
  gruvbox-yellow-bright: "hsl(42, 95%, 58%)"
  gruvbox-blue-bright: "hsl(157, 16%, 58%)"
  gruvbox-purple-bright: "hsl(344, 47%, 68%)"
  gruvbox-aqua-bright: "hsl(105, 35%, 62%)"
  gruvbox-orange-bright: "hsl(27, 99%, 55%)"

  #
  # Custom for light/dark
  #

  x-header-colour: "var(--gruvbox-bg-0h)"
  x-header-text-colour: "var(--x-text-colour)"
  x-divider-colour: "var(--gruvbox-bg-2)"

  #
  # VARIABLES (Identical below here for light and dark)
  #

  x-background-colour: "var(--gruvbox-bg-0)"
  x-card-background-colour: "var(--gruvbox-bg-1)"
  x-text-colour: "var(--gruvbox-fg-2)"
  x-secondary-text-colour: "var(--gruvbox-bg-5)"
  x-disabled-text-colour: "var(--gruvbox-fg-3)"
  x-icon-colour: "var(--gruvbox-blue-bright)"
  x-icon-colour-on: "var(--gruvbox-yellow-bright)"
  x-icon-colour-disabled: "#beae93"                                   # "var(--gruvbox-fg-3)"

  # RGB variants
  rgb-primary-text-color: "41, 41, 41"

  #
  # IMPLEMENTATION
  #

  # HA colours palette */
  ha-color-neutral-40: var(--gruvbox-fg-4)
  ha-color-neutral-80: var(--gruvbox-bg-2)
  ha-color-neutral-90: var(--gruvbox-bg-0h)
  ha-color-neutral-95: var(--gruvbox-bg-2)

  # Purlpe
  ha-color-primary-05: "#faf5f8"
  ha-color-primary-10: "#f6edf2"
  ha-color-primary-20: "#efdbe7"
  ha-color-primary-30: "#e4bdd3"
  ha-color-primary-40: "#d294b5"
  ha-color-primary-50: "#c1739a"
  ha-color-primary-60: "#b16286"
  ha-color-primary-70: "#924465"
  ha-color-primary-80: "#7a3a55"
  ha-color-primary-90: "#673449"
  ha-color-primary-95: "#3d1a28"

  ha-color-blue-05: "#f4f9f9"
  ha-color-blue-10: "#daedec"
  ha-color-blue-20: "#b5dad9"
  ha-color-blue-30: "#88c0c0"
